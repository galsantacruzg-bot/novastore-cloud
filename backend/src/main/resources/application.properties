spring.application.name=novastore-api
# Railway inyecta PORT. No se abre un segundo conector ni se utiliza Funnel.
server.address=0.0.0.0
server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework
spring.lifecycle.timeout-per-shutdown-phase=15s
server.tomcat.connection-timeout=15s

# Solo variables de entorno. Valores locales seguros para desarrollo.
spring.datasource.url=${SPRING_DATASOURCE_URL:${NOVASTORE_DB_URL:jdbc:postgresql://127.0.0.1:5432/novastore}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${NOVASTORE_DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# CORS exacto: ejemplo https://novastore-tienda.vercel.app (sin / final).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Cuentas para la demostracion académica. Sin proveedor externo, no se envia codigo.
# En producción comercial usa AUTH_REQUIRE_EMAIL_VERIFICATION=true y EMAIL_PROVIDER=resend.
app.auth.email-verification-required=${AUTH_REQUIRE_EMAIL_VERIFICATION:false}
app.auth.token-hours=${AUTH_TOKEN_HOURS:12}
app.auth.verification-minutes=10
app.auth.max-verification-attempts=5
app.admin.email=${ADMIN_EMAIL:admin@novastore.invalid}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# API HTTPS de Resend (opcional, sustituye SMTP 587/465).
app.mail.provider=${EMAIL_PROVIDER:disabled}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:no-reply@example.invalid}
# Gmail API OAuth2 HTTPS (alternativa a Resend; secretos SOLO en Railway)
app.mail.gmail-client-id=${GMAIL_CLIENT_ID:}
app.mail.gmail-client-secret=${GMAIL_CLIENT_SECRET:}
app.mail.gmail-refresh-token=${GMAIL_REFRESH_TOKEN:}

server.error.include-message=never
server.error.include-stacktrace=never
